<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4b91b">
<meta name="robots" content="noindex,nofollow">
<meta name="application-name" content="Agenda NFC">
<meta name="apple-mobile-web-app-title" content="Agenda NFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<title>Agenda · Next Finish</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#191919;--mu:#666b69;--ac:#f4b91b;--on:#171717;--ln:#e6e7e4;--rd:#bf392c;--wa:#158547}
:root[data-theme=dark]{--bg:#101113;--card:#1b1c1e;--tx:#f1f2f1;--mu:#a6aaa7;--ac:#f4b91b;--on:#171717;--ln:#343638;--rd:#eb8076;--wa:#3cc17a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101113;--card:#1b1c1e;--tx:#f1f2f1;--mu:#a6aaa7;--ac:#f4b91b;--on:#171717;--ln:#343638;--rd:#eb8076;--wa:#3cc17a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:90px}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:40px;border:0;background:none;border-radius:10px;padding:0 10px;cursor:pointer}
button:active{opacity:.6}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 8px 6px;border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center}
.nav button{font-size:20px;min-width:40px;padding:0}
#range{flex:1;text-align:center;font-weight:600}
#bHoje{font-size:14px;color:var(--ac);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:2px}
.strip button{min-height:50px;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);font-size:11px;border-radius:12px}
.strip b{font-size:17px;font-weight:600;color:var(--tx)}
.strip i{width:4px;height:4px;border-radius:2px;background:var(--ac);margin-top:1px}
.strip .z{background:none}
.strip .hoje b{color:var(--ac)}
.strip .sel{background:var(--ac)}.strip .sel,.strip .sel b{color:var(--on)}.strip .sel i{background:var(--on)}
.tools{display:flex;gap:6px;margin-top:6px}
.tools input,.tools select{min-height:40px;border:1px solid var(--ln);border-radius:10px;background:var(--card);padding:0 10px}
.tools input{flex:1;min-width:0}
main{padding:10px 12px}
.dh{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.dh h2{flex:1;margin:0;font-size:17px;font-weight:600;text-transform:capitalize}
.dh span{color:var(--mu);font-size:13px}
.dh button{color:var(--ac);font-weight:600;font-size:14px}
.box{background:var(--card);border-radius:14px;border:1px solid var(--ln);overflow:hidden}
.row{border-top:1px solid var(--ln)}.row:first-child{border-top:0}
.rh{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.hr{width:46px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--tx)}
.hr.late{color:var(--rd)}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:600;border:1px solid;border-radius:20px;min-height:30px;padding:0 10px}
.dt{padding:0 12px 12px 70px;font-size:14px}
.dt a{color:var(--ac);text-decoration:none;display:block;margin-bottom:4px}
.dt p{margin:4px 0}.dt .mu{color:var(--mu)}
.ac{display:flex;gap:6px;margin-top:8px}
.ac button{flex:1;border:1px solid var(--ln);font-weight:600;min-height:40px}
.ac .wa{color:var(--wa);border-color:var(--wa)}
.vazio{text-align:center;color:var(--mu);padding:36px 10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;background:var(--ac);color:var(--on);font-size:28px;padding:0;box-shadow:0 3px 10px #0004}
.bk{font-size:13px;color:var(--rd);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.bk button{border:1px solid var(--rd);color:var(--rd);min-height:32px;font-size:13px}
dialog{width:min(480px,94vw);max-height:92vh;border:0;border-radius:18px;padding:16px;background:var(--bg);color:var(--tx)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 8px;font-size:18px}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
label input,label select,label textarea{display:block;width:100%;min-height:42px;margin-top:2px;border:1px solid var(--ln);border-radius:10px;background:var(--card);padding:8px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr{display:flex;gap:8px;margin-top:14px}.fr button{flex:1;border:1px solid var(--ln);font-weight:600;min-height:44px}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac)!important}.del{color:var(--rd)}
.menu button{display:block;width:100%;text-align:left;border-top:1px solid var(--ln);border-radius:0;min-height:46px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;font-size:14px}
#toast.on{opacity:1}

/* NFC branding and three-view calendar */
body{background:var(--bg);letter-spacing:-.012em}
header{max-width:780px;margin:0 auto;padding:12px 12px 8px;border-bottom:1px solid var(--ln);box-shadow:0 3px 14px #00000007}
main{max-width:780px;margin:auto;padding:12px}
.brandbar{display:flex;align-items:center;gap:10px;padding:1px 2px 10px}
.brandbar img{width:37px;height:37px;object-fit:contain;border-radius:10px}
.brandtitle{display:flex;flex-direction:column;gap:0;line-height:1.18}
.brandtitle strong{font-size:15px;letter-spacing:-.02em}
.brandtitle small{font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.brandmark{margin-left:auto;font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--mu)}
.nav{gap:2px;margin-bottom:7px}
.nav button{border-radius:12px}
#range{font-size:17px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;min-width:0}
#bHoje{color:var(--tx);background:var(--card);border:1px solid var(--ln);padding:0 10px;border-radius:10px;font-size:12px;min-height:36px}
#bSearch,#bMenu{font-size:22px}
.viewbar{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;background:var(--ln);border-radius:13px;margin:2px 0 10px}
.viewbar button{min-height:35px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mu)}
.viewbar button.active{background:var(--ac);color:#161616;box-shadow:0 1px 3px #0002}
#strip{width:100%}
#strip.week-view{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
#strip.week-view button{min-width:0;min-height:67px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px}
#strip.week-view button span{font-size:11px}
#strip.week-view button b{font-size:20px}
#strip.week-view .sel{background:var(--ac);color:#151515}
#strip.week-view .sel b,#strip.week-view .sel span{color:#151515}
#strip.week-view .sel i{background:#151515}
#strip.week-view .hoje:not(.sel) b{color:#bd8a00}
#strip.month-view{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:1px 0}
.month-wd{text-align:center;font-size:10px;color:var(--mu);font-weight:700;text-transform:uppercase;padding:3px 0 6px}
.month-day{position:relative;min-width:0;height:53px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0;font-weight:700;font-size:14px}
.month-day.other{opacity:.38}
.month-day.today:not(.selected){border:1px solid var(--ac)}
.month-day.selected{background:var(--ac);color:#151515}
.month-day .dots{display:flex;justify-content:center;gap:3px;min-height:5px}
.month-day .dots i{height:5px;width:5px;border-radius:50%;background:#a97e08}
.month-day.selected .dots i{background:#151515}
.month-day .ncount{position:absolute;right:3px;top:2px;font-size:9px;color:var(--mu);font-style:normal}
.month-day.selected .ncount{color:#151515}
#viewHandle{display:flex;align-items:center;justify-content:center;width:100%;min-height:37px;gap:7px;border-radius:12px;color:var(--mu);font-size:12px;touch-action:pan-x;user-select:none}
#viewHandle .chev{color:var(--tx);font-size:20px;line-height:0}
#viewHandle:active{background:var(--ln)}
.dh{margin-top:12px;flex-wrap:wrap}
.dh h2{font-size:16px;min-width:140px}
.dh .scope{font-size:12px;border:1px solid var(--ln);border-radius:10px;padding:0 8px;background:var(--card);min-height:34px}
.date-group{padding:8px 12px 5px;font-size:11px;font-weight:800;text-transform:capitalize;letter-spacing:.02em;color:var(--mu);background:var(--bg);border-top:1px solid var(--ln)}
.date-group:first-child{border-top:none}
.row{background:var(--card)}
.row .pill{background:transparent}
.fab{background:var(--ac);color:#151515;font-weight:700;width:56px;height:56px;border-radius:18px;box-shadow:0 5px 18px #0003}
.dt a,.dh button:not(.scope){color:var(--tx)}
.pri{background:var(--ac);color:#151515}
@media(min-width:660px){.month-day{height:62px}}
@media(max-width:380px){.brandmark{display:none}#range{font-size:14px}.nav button{min-width:34px}.mini-grid span{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


/* Local-only customer and address suggestions */
.suggestions{margin:4px 0 8px;border:1px solid var(--ln);border-radius:12px;background:var(--card);max-height:180px;overflow-y:auto;box-shadow:0 8px 22px #0001}
.suggestions[hidden]{display:none!important}
.suggestions button{width:100%;height:auto;min-height:45px;padding:9px 12px;text-align:left;border-radius:0;border-bottom:1px solid var(--ln);display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.suggestions button:last-child{border-bottom:0}
.suggestions button:active{background:var(--ln)}
.suggestions b{font-size:13px;white-space:normal;overflow-wrap:anywhere}
.suggestions small{font-size:11px;color:var(--mu);white-space:normal;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="brandbar">
    <img src="./icon-192.png" alt="" aria-hidden="true">
    <div class="brandtitle"><strong>Next Finish Carpentry</strong><small>Agenda de serviços</small></div>
    <span class="brandmark">NFC · OHIO</span>
  </div>
  <div class="nav">
    <button id="bPrev" aria-label="Semana anterior">‹</button><div id="range"></div><button id="bNext" aria-label="Próxima semana">›</button>
    <button id="bHoje">Hoje</button><button id="bSearch" aria-label="Buscar">⌕</button><button id="bMenu" aria-label="Menu">⋯</button>
  </div>
  <div class="viewbar" id="viewbar" role="group" aria-label="Visualização da agenda">
    <button type="button" data-view="week" aria-pressed="true">Semana</button>
    <button type="button" data-view="month" aria-pressed="false">Mês</button>
  </div>
  <div id="strip" class="strip week-view" aria-label="Calendário"></div>
  <button type="button" id="viewHandle" aria-label="Expandir calendário">
    <span class="chev" aria-hidden="true">⌃</span><span id="viewHint">Deslize para cima para expandir</span>
  </button>
  <div class="tools" id="tools" hidden>
    <input id="q" type="search" placeholder="Buscar cliente, rua, serviço">
    <select id="f" aria-label="Status"><option value="todos">Todos</option><option>Pendente</option><option>Confirmado</option><option>Concluído</option></select>
  </div>
</header>
<main>
  <div id="bkp"></div>
  <div id="dh" class="dh"></div>
  <div id="list"></div>
</main>
<button class="fab" id="bAdd" aria-label="Novo serviço">+</button>

<dialog id="dlg"><form method="dialog" id="fm" style="margin:0">
  <h3 id="dt">Novo serviço</h3>
  <label>Cliente<input name="cliente" required autocomplete="off" placeholder="Comece a digitar o nome"></label>
  <div class="suggestions" id="clientHints" aria-label="Clientes sugeridos" hidden></div>
  <div class="g2"><label>Data<input name="data" type="date" required></label><label>Horário<input name="hora" type="time"></label></div>
  <label>Endereço<input name="endereco" autocomplete="off" placeholder="Comece a digitar a rua"></label>
  <div class="suggestions" id="addressHints" aria-label="Endereços sugeridos" hidden></div>
  <label>Serviço<textarea name="servico" rows="2"></textarea></label>
  <div class="g2"><label>Telefone<input name="tel" type="tel" inputmode="tel"></label><label>Valor<input name="valor" placeholder="$150"></label></div>
  <label>Status<select name="status"><option>Pendente</option><option>Confirmado</option><option>Concluído</option></select></label>
  <label>Observações<textarea name="obs" rows="2"></textarea></label>
  <div class="fr"><button type="button" id="bCancel">Cancelar</button><button type="button" class="del" id="bDel">Excluir</button><button type="submit" class="pri">Salvar</button></div>
</form></dialog>

<dialog id="mdl"><div class="menu">
  <h3>Opções</h3>
  <button id="mConf">Confirmar todos do dia</button>
  <button id="mSem">Copiar semana</button>
  <button id="mTema">Modo claro/escuro</button>
  <button id="mLang"></button>
  <button id="mExp">Exportar backup (JSON)</button>
  <button id="mImp">Importar backup (JSON)</button>
  <button id="mCli">Importar clientes (CSV)</button>
  <button id="mTxt">Importar de texto colado</button>
  <button id="mClose" style="text-align:center;font-weight:600">Fechar</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="clientfile" accept=".csv,text/csv,text/plain" hidden>
</div></dialog>

<dialog id="tdl"><h3>Importar de texto</h3>
  <p style="color:var(--mu);font-size:13px;margin:0 0 8px">Uma linha por serviço: Cliente - 10:00 - Endereço - Serviço. Entram no dia selecionado.</p>
  <textarea id="tx" rows="7" style="width:100%;border:1px solid var(--ln);border-radius:10px;background:var(--card);padding:10px"></textarea>
  <div class="fr"><button id="tCancel">Cancelar</button><button id="tOk" class="pri">Importar</button></div>
</dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),KEY='agenda-nfc-public-v1',ST=['Pendente','Confirmado','Concluído'];
const SC={Pendente:'#c47a12',Confirmado:'#2f6fb5','Concluído':'#2e7d4f'};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const prs=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x};
const fmt=(d,o)=>d.toLocaleDateString('pt-BR',o);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const SEED=[];

let items=ld(KEY,null),P={lang:'en',theme:'',bk:0,...ld(KEY+'-p',{})};
let clients=ld(KEY+'-c',null);
const nk=s=>String(s||'').trim().toLowerCase();
function upCl(i){if(!i.cliente)return;const k=nk(i.cliente),c=clients[k]||{};clients[k]={nome:i.cliente.trim(),tel:i.tel||c.tel||'',endereco:i.endereco||c.endereco||''}}
if(!items)items=SEED;
if(!clients){clients={};items.forEach(upCl)}
save();
const S={ws:iso(mon(new Date())),sel:iso(new Date()),q:'',f:'todos',edit:null,open:null,view:['week','month'].includes(P.view)?P.view:'week',scope:P.view==='month'?'period':'day'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(KEY+'-p',JSON.stringify(P));localStorage.setItem(KEY+'-c',JSON.stringify(clients))}catch(e){toast('Não foi possível salvar')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
const key=i=>i.data+(i.hora||'99:99');
const late=i=>{if(i.status==='Concluído')return false;const d=prs(i.data);if(i.hora){const[h,m]=i.hora.split(':');d.setHours(+h,+m)}else d.setHours(23,59);return d<new Date()};
const h12=t=>{const[h,m]=t.split(':').map(Number);return((h+11)%12+1)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};

function setView(next){
  const choices=['week','month'];
  if(!choices.includes(next))return;
  S.view=next;
  S.scope=next==='week'?'day':'period';
  S.open=null;
  P.view=next;
  save();
  render();
}

function goToDay(day){
  S.sel=day;
  S.ws=iso(mon(prs(day)));
  S.scope='day';
  S.open=null;
  S.q='';
  $('#q').value='';
  render();
}


function moveBy(n){
  const d=prs(S.sel);
  if(S.view==='week') d.setDate(d.getDate()+n*7);
  else {
    const day=d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth()+n);
    const finalDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,finalDay));
  }
  S.sel=iso(d);S.ws=iso(mon(d));S.open=null;render();
}

function render(){
 document.documentElement.dataset.theme=P.theme;
 const today=iso(new Date()),selected=prs(S.sel),ws=prs(S.ws);
 const we=new Date(ws);we.setDate(we.getDate()+6);
 const mode=S.view;
 const yr=selected.getFullYear(),mn=selected.getMonth();
 const monthKey=S.sel.slice(0,7);
 const monthLabel=fmt(selected,{month:'long',year:'numeric'});
 $('#range').textContent=mode==='week'
   ?fmt(ws,{day:'numeric',month:'short'})+' – '+fmt(we,{day:'numeric',month:'short'})
   :monthLabel[0].toUpperCase()+monthLabel.slice(1);
 $('#bPrev').setAttribute('aria-label',mode==='week'?'Semana anterior':'Mês anterior');
 $('#bNext').setAttribute('aria-label',mode==='week'?'Próxima semana':'Próximo mês');
 document.querySelectorAll('#viewbar button').forEach(b=>{
   const active=b.dataset.view===mode;
   b.classList.toggle('active',active);
   b.setAttribute('aria-pressed',String(active));
 });
 const hint=mode==='week'?'Expandir para o mês':'Recolher para a semana';
 $('#viewHint').textContent=hint;
 $('#viewHandle').setAttribute('aria-label',hint+'; deslize para cima ou para baixo');
 $('#viewHandle .chev').textContent=mode==='week'?'⌃':'⌄';
 const counts=new Map();
 for(const item of items)counts.set(item.data,(counts.get(item.data)||0)+1);
 let markup='';
 if(mode==='week'){
   for(let n=0;n<7;n++){
     const d=new Date(ws);d.setDate(d.getDate()+n);
     const k=iso(d),c=counts.get(k)||0;
     markup+=`<button type="button" aria-label="${fmt(d,{weekday:'long',day:'numeric',month:'long'})}${c?' · '+c+' serviços':''}" data-d="${k}" class="${k===today?'hoje ':''}${k===S.sel?'sel':''}"><span>${fmt(d,{weekday:'short'}).replace('.','')}</span><b>${d.getDate()}</b>${c?'<i></i>':'<i class="z"></i>'}</button>`;
   }
 } else if(mode==='month'){
   const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
   markup=days.map(d=>`<span class="month-wd">${d}</span>`).join('');
   const offset=new Date(yr,mn,1).getDay();
   const total=new Date(yr,mn+1,0).getDate();
   const cells=Math.ceil((offset+total)/7)*7;
   for(let p=0;p<cells;p++){
     const d=new Date(yr,mn,p-offset+1);
     const k=iso(d),c=counts.get(k)||0;
     const other=d.getMonth()!==mn;
     markup+=`<button type="button" data-d="${k}" aria-label="${fmt(d,{weekday:'long',day:'numeric',month:'long'})}${c?', '+c+' serviço'+(c>1?'s':''):''}" class="month-day${other?' other':''}${k===today?' today':''}${k===S.sel?' selected':''}"><span>${d.getDate()}</span><span class="dots">${c?'<i></i>':''}${c>1?'<i></i>':''}${c>2?'<i></i>':''}</span>${c>3?`<em class="ncount">${c}</em>`:''}</button>`;
   }
 }
 const calendar=$('#strip');calendar.className='strip '+mode+'-view';calendar.innerHTML=markup;
 const q=S.q.trim().toLowerCase();
 let L=items.filter(i=>{
   if(q)return(i.cliente+' '+i.endereco+' '+i.servico+' '+i.tel).toLowerCase().includes(q);
   if(S.scope==='period'&&mode==='month')return i.data.startsWith(monthKey);
   return i.data===S.sel;
 });
 if(S.f!=='todos')L=L.filter(i=>i.status===S.f);
 L.sort((a,b)=>(iKey(a)).localeCompare(iKey(b)));
 const isPeriod=!q&&S.scope==='period'&&mode!=='week';
 const periodTitle='Serviços do mês';
 const dayTitle=fmt(prs(S.sel),{weekday:'long',day:'numeric',month:'long'});
 const label=q?'Resultados':isPeriod?periodTitle:dayTitle;
 const scopeButton=!q&&mode!=='week'
    ?`<button type="button" class="scope" data-a="scope">${isPeriod?'Ver dia':'Ver mês completo'}</button>`:'';
 $('#dh').innerHTML=`<h2>${label}</h2><span>${L.length} ${L.length===1?'serviço':'serviços'}</span>${scopeButton}<button type="button" data-a="cd">Copiar</button>`;
 const old=items.length&&Date.now()-P.bk>7*864e5;
 $('#bkp').innerHTML=old?`<div class="bk"><span>Sem backup há mais de 7 dias.</span><button data-a="bk">Fazer backup</button></div>`:'';
 let rows='',lastDate='';
 for(const i of L){
   if((isPeriod||q)&&i.data!==lastDate){
     rows+=`<div class="date-group">${fmt(prs(i.data),{weekday:'long',day:'numeric',month:'long'})}</div>`;
     lastDate=i.data;
   }
   const o=S.open===i.id;
   rows+=`<div class="row" data-id="${esc(i.id)}">
     <div class="rh"><span class="hr${late(i)?' late':''}">${esc(i.hora||'--:--')}</span><div class="mid"><b>${esc(i.cliente)}</b>${o?'':`<small>${esc(i.servico||i.endereco)}</small>`}</div><button type="button" class="pill" data-a="st" style="color:${SC[i.status]||SC.Pendente}">${esc(i.status)}</button></div>
     ${o?`<div class="dt">${i.endereco?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(i.endereco)}">${esc(i.endereco)}</a>`:''}${i.servico?`<p>${esc(i.servico)}</p>`:''}${i.valor?`<p><b>${esc(i.valor)}</b></p>`:''}${i.obs?`<p class="mu">${esc(i.obs)}</p>`:''}
       <div class="ac"><button type="button" class="wa" data-a="wa">WhatsApp</button><button type="button" data-a="rp">Repetir</button><button type="button" data-a="ed">Editar</button></div></div>`:''}
   </div>`;
 }
 $('#list').innerHTML=L.length?`<div class="box">${rows}</div>`:`<div class="vazio">${q?'Nada encontrado.':'Nenhum serviço neste período.'}</div>`;
}

function iKey(i){return (i.data||'')+(i.hora||'99:99')}

function blk(i){return[`${i.hora||'--:--'} – ${i.cliente}`,i.endereco&&'📍 '+i.endereco,i.servico&&'🔧 '+i.servico,i.valor&&'💲 '+i.valor,i.tel&&'📞 '+i.tel].filter(Boolean).join('\n')}
const dTitle=k=>{const t=fmt(prs(k),{weekday:'long',day:'2-digit',month:'2-digit'});return'📅 '+t[0].toUpperCase()+t.slice(1)};
function dayText(k){const L=items.filter(i=>i.data===k).sort((a,b)=>key(a).localeCompare(key(b)));return dTitle(k)+'\n\n'+(L.length?L.map(blk).join('\n\n'):'Sem serviços')}
function weekText(){const ws=prs(S.ws),o=[];for(let n=0;n<7;n++){const d=new Date(ws);d.setDate(d.getDate()+n);const k=iso(d);if(items.some(i=>i.data===k))o.push(dayText(k))}return o.join('\n\n———\n\n')||'Sem serviços na semana'}
function periodText(){
 const scope=S.sel.slice(0,7);
 const events=items.filter(i=>i.data.startsWith(scope)).sort((a,b)=>iKey(a).localeCompare(iKey(b)));
 return events.length?events.map(i=>dTitle(i.data)+'\n'+blk(i)).join('\n\n———\n\n'):'Sem serviços no período';
}
async function copy(t,ok){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(ok)}

function msg(i){const d=prs(i.data);
  if(P.lang==='pt')return`Olá ${i.cliente}, aqui é o Luiz da Next Finish Carpentry. Confirmando nosso serviço ${fmt(d,{weekday:'long',day:'numeric',month:'long'})}${i.hora?' às '+i.hora:''}${i.endereco?' em '+i.endereco:''}. Tudo certo?`;
  return`Hi ${i.cliente}, this is Luiz from Next Finish Carpentry. Confirming our appointment on ${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}${i.hora?' at '+h12(i.hora):''}${i.endereco?' at '+i.endereco:''}. Does that still work for you?`}
function wa(i){let n=(i.tel||'').replace(/\D/g,'');if(n.length===10)n='1'+n;window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg(i))}`,'_blank')}

const dlg=$('#dlg'),fm=$('#fm');
const normalizeSearch=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLocaleLowerCase('pt-BR');
const normalizedKey=s=>normalizeSearch(s).replace(/\s+/g,' ');
function clientEntries(){
  return Object.entries(clients).filter(([k,c])=>c&&c.nome).map(([key,c])=>({key,...c}));
}
function fillList(){ /* Native datalist replaced by touch-friendly matching suggestions. */ }
function hideHints(){
  $('#clientHints').hidden=true;$('#addressHints').hidden=true;
}
function addressEntries(){
 const options=new Map();
 for(const c of clientEntries()){
   if(!c.endereco)continue;
   const key=normalizedKey(c.endereco);
   if(!options.has(key))options.set(key,{endereco:c.endereco,cliente:c.nome,tel:c.tel||''});
 }
 for(const i of items){
   if(!i.endereco)continue;
   const key=normalizedKey(i.endereco);
   if(!options.has(key))options.set(key,{endereco:i.endereco,cliente:i.cliente||'',tel:i.tel||''});
 }
 return [...options.values()];
}
function presentHints(type){
 const isClient=type==='cliente',field=fm.elements[type],panel=$(isClient?'#clientHints':'#addressHints');
 const query=normalizeSearch(field.value);
 if(!query){panel.hidden=true;panel.innerHTML='';return}
 const matches=(isClient?clientEntries():addressEntries()).filter(x=>
   normalizeSearch(isClient?x.nome:x.endereco).includes(query)
 ).sort((a,b)=>{
   const av=normalizeSearch(isClient?a.nome:a.endereco),bv=normalizeSearch(isClient?b.nome:b.endereco);
   return Number(bv.startsWith(query))-Number(av.startsWith(query))||av.localeCompare(bv);
 }).slice(0,8);
 if(!matches.length){panel.hidden=true;panel.innerHTML='';return}
 panel.innerHTML=matches.map((c,index)=>`<button type="button" data-idx="${index}"><b>${esc(isClient?c.nome:c.endereco)}</b><small>${esc(isClient?[c.endereco,c.tel].filter(Boolean).join(' · '):c.cliente)}</small></button>`).join('');
 panel._matches=matches;panel.hidden=false;
}
function selectHint(type,index){
 const panel=$(type==='cliente'?'#clientHints':'#addressHints');
 const c=panel._matches&&panel._matches[index];
 if(!c)return;
 if(type==='cliente'){
   fm.elements.cliente.value=c.nome||'';
   fm.elements.tel.value=c.tel||'';
   fm.elements.endereco.value=c.endereco||'';
 }else{
   fm.elements.endereco.value=c.endereco||'';
   const entered=normalizedKey(fm.elements.cliente.value);
   if(!entered||entered===normalizedKey(c.cliente)){
     if(!entered)fm.elements.cliente.value=c.cliente||'';
     if(!fm.elements.tel.value)fm.elements.tel.value=c.tel||'';
   }
 }
 hideHints();
}
for(const type of ['cliente','endereco']){
 fm.elements[type].addEventListener('input',()=>{
   if(type==='cliente'){
     const c=clients[nk(fm.elements.cliente.value)]||clientEntries().find(x=>normalizedKey(x.nome)===normalizedKey(fm.elements.cliente.value));
     if(c){
       if(!fm.elements.tel.value)fm.elements.tel.value=c.tel||'';
       if(!fm.elements.endereco.value)fm.elements.endereco.value=c.endereco||'';
     }
   }
   presentHints(type);
 });
 fm.elements[type].addEventListener('focus',()=>presentHints(type));
}
for(const [type,id] of [['cliente','#clientHints'],['endereco','#addressHints']]){
 $(id).addEventListener('click',e=>{
   const b=e.target.closest('button[data-idx]');
   if(b)selectHint(type,Number(b.dataset.idx));
 });
}
document.addEventListener('pointerdown',e=>{
 if(!e.target.closest('#clientHints')&&!e.target.closest('#addressHints')&&!e.target.closest('input[name="cliente"]')&&!e.target.closest('input[name="endereco"]'))hideHints();
});
function openForm(i,novo){fillList();hideHints();S.edit=i&&!novo?i.id:null;$('#dt').textContent=S.edit?'Editar serviço':'Novo serviço';$('#bDel').style.display=S.edit?'':'none';
  const v=i||{data:S.sel,status:'Pendente'};for(const e of fm.elements)if(e.name)e.value=v[e.name]??'';dlg.showModal()}
fm.addEventListener('submit',()=>{const o={};for(const x of fm.elements)if(x.name)o[x.name]=x.value.trim();
  if(S.edit){Object.assign(items.find(i=>i.id===S.edit),o)}else items.push({id:uid(),...o});
  upCl(o);save();S.sel=o.data;S.ws=iso(mon(prs(o.data)));render();toast('Salvo')});
$('#bCancel').onclick=()=>{hideHints();dlg.close()};
$('#bDel').onclick=()=>{if(confirm('Excluir este serviço?')){items=items.filter(i=>i.id!==S.edit);save();dlg.close();render()}};
$('#bAdd').onclick=()=>openForm();

$('#list').onclick=e=>{const row=e.target.closest('.row');if(!row)return;const i=items.find(x=>x.id===row.dataset.id),b=e.target.closest('button');if(!i)return;
  if(!b){if(e.target.closest('a'))return;S.open=S.open===i.id?null:i.id;return render()}
  if(b.dataset.a==='st'){i.status=ST[(ST.indexOf(i.status)+1)%3];save();render()}
  else if(b.dataset.a==='wa')wa(i);else if(b.dataset.a==='ed')openForm(i);else if(b.dataset.a==='rp')openForm({cliente:i.cliente,tel:i.tel,endereco:i.endereco,data:S.sel,status:'Pendente'},true)};
$('#dh').onclick=e=>{
  if(e.target.dataset.a==='cd')copy(S.scope==='period'&&S.view!=='week'?periodText() : dayText(S.sel),'Agenda copiada');
  if(e.target.dataset.a==='scope'){S.scope=S.scope==='period'?'day':'period';S.open=null;render()}
};

$('#strip').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.d)goToDay(b.dataset.d);
};
$('#viewbar').onclick=e=>{
  const b=e.target.closest('button[data-view]');
  if(b)setView(b.dataset.view);
};
let ignoreHandleClickUntil=0;
$('#viewHandle').onclick=()=>{
  if(Date.now()<ignoreHandleClickUntil)return;
  setView(S.view==='week'?'month':'week');
};
let gestureStart=null;
$('#viewHandle').addEventListener('touchstart',e=>{
  if(e.touches.length===1)gestureStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
$('#viewHandle').addEventListener('touchend',e=>{
  if(!gestureStart||!e.changedTouches.length)return;
  const dy=e.changedTouches[0].clientY-gestureStart.y;
  const dx=e.changedTouches[0].clientX-gestureStart.x;gestureStart=null;
  if(Math.abs(dy)<25||Math.abs(dy)<Math.abs(dx))return;
  const next=dy<0?'month':'week';
  if(next!==S.view){ignoreHandleClickUntil=Date.now()+600;setView(next);}
},{passive:true});
$('#bPrev').onclick=()=>moveBy(-1);
$('#bNext').onclick=()=>moveBy(1);
$('#bHoje').onclick=()=>{S.sel=iso(new Date());S.ws=iso(mon(new Date()));S.scope=S.view==='week'?'day':'period';$('#q').value='';S.q='';S.open=null;render()};
$('#bSearch').onclick=()=>{const t=$('#tools');t.hidden=!t.hidden;if(!t.hidden)$('#q').focus();else{$('#q').value='';S.q='';S.f='todos';$('#f').value='todos';render()}};
$('#q').oninput=e=>{S.q=e.target.value;render()};$('#f').onchange=e=>{S.f=e.target.value;render()};

const mdl=$('#mdl'),lbl=()=>$('#mLang').textContent='Idioma da mensagem: '+(P.lang==='en'?'Inglês (EN)':'Português (PT)');
$('#bMenu').onclick=()=>{lbl();mdl.showModal()};$('#mClose').onclick=()=>mdl.close();
$('#mConf').onclick=()=>{let n=0;items.forEach(i=>{if(i.data===S.sel&&i.status==='Pendente'){i.status='Confirmado';n++}});save();mdl.close();render();toast(n+' confirmado'+(n==1?'':'s'))};
$('#mSem').onclick=()=>{mdl.close();copy(weekText(),'Semana copiada')};
$('#mTema').onclick=()=>{const dark=matchMedia('(prefers-color-scheme: dark)').matches;const cur=P.theme||(dark?'dark':'light');P.theme=cur==='dark'?'light':'dark';save();render()};
$('#mLang').onclick=()=>{P.lang=P.lang==='en'?'pt':'en';save();lbl()};
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({items,clients},null,1)],{type:'application/json'}));a.download='agenda-backup-'+iso(new Date())+'.json';a.click();P.bk=Date.now();save();render();toast('Backup baixado')}
$('#mExp').onclick=()=>{mdl.close();backup()};$('#bkp').onclick=e=>{if(e.target.dataset.a==='bk')backup()};

function parseClientCSV(source){
 const raw=String(source||'').replace(/^\uFEFF/,'');
 const first=raw.split(/\r?\n/).find(line=>line.trim())||'';
 const delimiters=[',',';','\t'];
 const delimit=delimiters.map(del=>({del,count:countOutsideQuotes(first,del)})).sort((a,b)=>b.count-a.count)[0];
 if(!delimit||delimit.count<1)throw Error('Cabeçalho CSV não reconhecido');
 const delim=delimit.del,rows=[],row=[];let part='',quoted=false;
 for(let i=0;i<raw.length;i++){
   const ch=raw[i];
   if(ch==='"'){
     if(quoted&&raw[i+1]==='"'){part+='"';i++}
     else quoted=!quoted;
   }else if(ch===delim&&!quoted){row.push(part);part=''}
   else if((ch==='\n'||ch==='\r')&&!quoted){
     if(ch==='\r'&&raw[i+1]==='\n')i++;
     row.push(part);part='';
     if(row.some(x=>x.trim()))rows.push([...row]);
     row.length=0;
   }else part+=ch;
 }
 if(quoted)throw Error('Aspas não fechadas no CSV');
 row.push(part);if(row.some(x=>x.trim()))rows.push(row);
 if(rows.length<2)throw Error('Nenhum cliente encontrado');
 const header=rows.shift().map(normalizeSearch);
 const indexOf=(names)=>header.findIndex(x=>names.includes(x));
 const nameIdx=indexOf(['nome','cliente','name','client']);
 const addrIdx=indexOf(['endereco','endereco completo','address','rua','local']);
 const phoneIdx=indexOf(['telefone','celular','phone','tel','contato']);
 if(nameIdx<0)throw Error('Coluna Nome não encontrada');
 const customers=[];
 for(const cols of rows){
   const nome=(cols[nameIdx]||'').trim().slice(0,150);
   if(!nome)continue;
   const endereco=addrIdx>=0?(cols[addrIdx]||'').trim().slice(0,500):'';
   const tel=phoneIdx>=0?(cols[phoneIdx]||'').trim().slice(0,70):'';
   customers.push({nome,endereco,tel});
 }
 if(!customers.length)throw Error('Nenhum nome válido encontrado');
 return customers;
}
function countOutsideQuotes(line,delimiter){
 let quoted=false,count=0;
 for(let i=0;i<line.length;i++){
   if(line[i]==='"'){
     if(quoted&&line[i+1]==='"')i++;
     else quoted=!quoted;
   }else if(line[i]===delimiter&&!quoted)count++;
 }
 return count;
}
$('#mCli').onclick=()=>$('#clientfile').click();
$('#clientfile').onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 try{
   if(f.size>1024*1024)throw Error('CSV maior que 1 MB');
   const records=parseClientCSV(await f.text());
   if(!confirm('Importar '+records.length+' clientes? A agenda e os serviços atuais serão preservados.'))return;
   const draft={...clients};
   let added=0,updated=0;
   for(const c of records){
     const existing=Object.entries(draft).find(([k,v])=>normalizedKey(v?.nome||k)===normalizedKey(c.nome));
     const key=existing?existing[0]:nk(c.nome),prev=draft[key]||{};
     if(existing)updated++;else added++;
     draft[key]={nome:c.nome,endereco:c.endereco||prev.endereco||'',tel:c.tel||prev.tel||''};
   }
   clients=draft;save();fillList();hideHints();mdl.close();
   toast((added+updated)+' clientes disponíveis');
 }catch(err){toast(err?.message||'CSV inválido')}
 finally{e.target.value=''}
};

$('#mImp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text()),a=Array.isArray(j)?j:j.items;if(!Array.isArray(a))throw 0;
  if(confirm(`Importar ${a.length} serviços? Isso substitui tudo que está no app.`)){items=a.map(x=>({...x,id:uid()}));clients=(!Array.isArray(j)&&j.clients)||{};items.forEach(upCl);save();mdl.close();render();toast('Importado')}}catch(x){toast('Arquivo inválido')}e.target.value=''};
$('#mTxt').onclick=()=>{mdl.close();$('#tdl').showModal()};$('#tCancel').onclick=()=>$('#tdl').close();
$('#tOk').onclick=()=>{let n=0;$('#tx').value.split('\n').forEach(l=>{const p=l.split(/\s+[-–—]\s+/).map(s=>s.trim()).filter(Boolean);if(!p.length)return;
  const ti=p.findIndex((s,k)=>k>0&&/^\d{1,2}:\d{2}$/.test(s)),hora=ti>0?p.splice(ti,1)[0].padStart(5,'0'):'';
  items.push({id:uid(),cliente:p[0],data:S.sel,hora,endereco:p[1]||'',servico:p[2]||'',valor:'',tel:'',status:'Pendente',obs:''});upCl(items[items.length-1]);n++});
  save();$('#tx').value='';$('#tdl').close();render();toast(n+' importado'+(n==1?'':'s'))};
render();
</script>
